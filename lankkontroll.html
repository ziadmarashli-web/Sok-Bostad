<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Länkkontroll – Sök bostad</title>
<style>
:root{--blue:#1a5e9a;--blue2:#144b7c;--bg:#f4f2ec;--line:#dbe4ee;--ok:#047857;--bad:#b91c1c;--muted:#64748b}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:#0f172a}
main{max-width:1100px;margin:auto;padding:24px} h1{margin:0 0 6px;font-size:clamp(26px,4vw,40px)} p{line-height:1.55} .muted{color:var(--muted)}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:18px;box-shadow:0 2px 8px #0f172a0d;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px} .stat{background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;padding:12px} .stat b{display:block;font-size:24px;color:var(--blue)}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center} button,input{font:inherit} button{border:0;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer} .primary{background:var(--blue);color:#fff} .secondary{background:#fff;border:1px solid #cbd5e1;color:#334155}
input[type=search]{flex:1;min-width:220px;border:1px solid #cbd5e1;border-radius:12px;padding:10px 12px;background:#fff}
table{width:100%;border-collapse:collapse;background:#fff} th,td{padding:11px 10px;border-bottom:1px solid #e2e8f0;text-align:left;vertical-align:top} th{background:#eff6ff;font-size:13px} td{font-size:14px}
a{color:var(--blue);font-weight:700} .choices{display:flex;gap:10px;flex-wrap:wrap} label{font-size:13px;font-weight:700;white-space:nowrap} .ok{color:var(--ok)} .bad{color:var(--bad)}
.badge{display:inline-block;background:#eff6ff;color:var(--blue2);border:1px solid #bfdbfe;border-radius:999px;padding:3px 8px;font-size:12px;font-weight:700}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)} table,thead,tbody,tr,th,td{display:block} thead{display:none} tr{border:1px solid #e2e8f0;border-radius:14px;margin:10px 0;padding:10px;background:#fff} td{border:0;padding:5px 2px} td:before{content:attr(data-label);font-size:11px;text-transform:uppercase;color:var(--muted);display:block;font-weight:800;margin-bottom:2px}}
@media print{.no-print{display:none!important} body{background:#fff} main{max-width:none;padding:0} .card{box-shadow:none} tr{break-inside:avoid}}
</style>
</head>
<body><main>
<div class="card">
<h1>Länkkontroll</h1>
<p class="muted">Kontrollera länkarna som används i <strong>Sök bostad – Västra Götaland</strong>. Status sparas bara i den här webbläsaren.</p>
<div class="stats" id="stats"></div>
</div>
<div class="card no-print">
<div class="controls">
<input id="q" type="search" placeholder="Sök bolag eller ort…">
<button class="secondary" id="showBad">Visa bara trasiga</button>
<button class="secondary" id="showAll">Visa alla</button>
<button class="secondary" id="reset">Nollställ markeringar</button>
<button class="primary" onclick="window.print()">Skriv ut / spara PDF</button>
</div></div>
<div class="card" style="padding:0;overflow:hidden"><table><thead><tr><th>#</th><th>Hyresvärd</th><th>Ort</th><th>Länk</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div>
<p class="muted">Källa: <code>bolag.json</code>. Ändra inte bolagsuppgifter direkt i den här filen.</p>
</main>
<script>
/* BOLAG_DATA_START */
const COMPANIES = [{"name":"AB Bostäder i Lidköping","url":"https://www.bostaderlidkoping.se/","orter":["Lidköping"],"note":"kommunal"},{"name":"Alebyggen","url":"https://www.alebyggen.se/","orter":["Ale"],"note":"kommunal"},{"name":"Alingsåshem","url":"https://www.alingsashem.se/","orter":["Alingsås"],"note":"kommunal"},{"name":"Ante Fastigheter","url":"https://antefastigheter.se/","orter":["Alingsås"]},{"name":"Arkblad Fastigheter","url":"https://www.arkbladfastigheter.se/","orter":["Alingsås"]},{"name":"Balder","url":"https://www.balder.se/","orter":["Alingsås","Floda","Lerum"]},{"name":"Bengtsforshus","url":"https://www.bengtsforshus.se/","orter":["Bengtsfors"],"note":"kommunal"},{"name":"Blank & Söner AB","url":"https://www.blanksoner.se/","orter":["Falköping","Skövde","Skara","Lidköping"]},{"name":"Bofast","url":"https://www.bofast.se/","orter":["Svenljunga","Tranemo"]},{"name":"Bollebo","url":"https://www.bollebo.se/","orter":["Bollebygd"],"note":"kommunal"},{"name":"Boplats","url":"https://boplats.se","orter":["Göteborg","Ale","Alingsås","Kungälv","Lerum","Partille","Mölndal"],"note":"formedling"},{"name":"Bostäder i Borås","url":"https://www.bostaderiboras.se/","orter":["Borås"],"note":"kommunal"},{"name":"CA Fastigheter","url":"https://www.cafastigheter.se/","orter":["Borås"]},{"name":"Cederqvist Fastigheter AB","url":"https://www.cederqvistfastigheter.se/","orter":["Tidaholm","Falköping","Töreboda"]},{"name":"Centrumbostäder i Skara","url":"https://www.centrumbostader.se/","orter":["Skara"],"note":"kommunal"},{"name":"Derome Förvaltning","url":"https://www.deromeforvaltning.se/","orter":["Göteborg","Mölndal","Mölnlycke"]},{"name":"Edethus","url":"https://www.edethus.se/","orter":["Lilla Edet"],"note":"kommunal"},{"name":"Edshus (Dals-Ed)","url":"https://www.edshus.se/","orter":["Ed"],"note":"kommunal"},{"name":"Eidar (Trollhättans Bostadsbolag)","url":"https://www.eidar.se/","orter":["Trollhättan"],"note":"kommunal"},{"name":"Ell-K Invest AB","url":"https://www.ell-kinvest.se/","orter":["Falköping"]},{"name":"Essungabostäder","url":"https://www.essungabostader.se/","orter":["Essunga"],"note":"kommunal"},{"name":"Fortinova","url":"https://www.fortinova.se/","orter":["Borås","Göteborg","Götene","Lilla Edet","Uddevalla"]},{"name":"Fristadsbostäder","url":"https://fribo.nu/","orter":["Borås"],"note":"kommunal"},{"name":"Förbo","url":"https://minasidor.foerbo.se/","orter":["Lerum","Floda","Gråbo","Stenkullen","Tollered","Mölndal","Härryda","Kungälv"],"note":"kommunal"},{"name":"Gullspångsbostäder","url":"https://www.gullspangsbostader.se/","orter":["Gullspång"],"note":"kommunal"},{"name":"Götenebostäder","url":"https://www.gotenebostader.se/","orter":["Götene"],"note":"kommunal"},{"name":"Herbo","url":"https://herbo.se/","orter":["Herrljunga"],"note":"kommunal"},{"name":"Hyresbo","url":"https://hyresbo.se/","orter":["Falköping"]},{"name":"Karlsborgsbostäder","url":"https://www.karlsborgsbostader.se/","orter":["Karlsborg"],"note":"kommunal"},{"name":"Knallehem","url":"https://www.knallehem.se/intresseanmalan","orter":["Mark"]},{"name":"Kungälvsbostäder","url":"https://www.kungalvsbostader.se/","orter":["Kungälv"],"note":"kommunal"},{"name":"Kvarteret Lyckebo","url":"https://kvlyckebo.se","orter":["Bollebygd"]},{"name":"Larsson Fastigheter","url":"https://www.larssonsfastigheter.se/","orter":["Borås","Sandared","Ulricehamn"]},{"name":"Lysekilsbostäder","url":"https://www.lysekilsbostader.se/","orter":["Lysekil"],"note":"kommunal"},{"name":"Mariehus","url":"https://www.mariehus.se/","orter":["Mariestad"],"note":"kommunal"},{"name":"Marks Bostads AB","url":"https://www.marksbostadsab.se/","orter":["Mark"],"note":"kommunal"},{"name":"Mellerudsbostäder","url":"https://www.mellbo.se/","orter":["Mellerud"],"note":"kommunal"},{"name":"Munkbo","url":"https://www.munkbo.se/","orter":["Munkedal"],"note":"kommunal"},{"name":"Mölndalsbostäder","url":"https://www.molndalsbostader.se/","orter":["Mölndal","Kållered"],"note":"kommunal"},{"name":"Nefast","url":"https://nefast.se/bostader/","orter":["Alingsås"]},{"name":"Olofssons Fastigheter","url":"https://www.olofssonfastigheter.se/","orter":["Borås"]},{"name":"Orustbostäder","url":"https://www.orustbostader.se/","orter":["Orust"],"note":"kommunal"},{"name":"Partillebo","url":"https://www.partillebo.se/","orter":["Partille"],"note":"kommunal"},{"name":"Paxon AB","url":"https://www.paxon.se/","orter":["Vårgårda","Herrljunga"]},{"name":"PP Fastigheter","url":"https://www.ppfastigheter.se/","orter":["Härryda","Landvetter","Hindås"]},{"name":"Skövdebostäder","url":"https://www.skovdebostader.se/","orter":["Skövde"],"note":"kommunal"},{"name":"Sotenäsbostäder","url":"https://www.sotenasbostader.se/","orter":["Sotenäs"],"note":"kommunal"},{"name":"Strand AB","url":"https://www.strandab.se/","orter":["Bollebygd","Rävlanda","Hindås","Mölnlycke"]},{"name":"Strömstadsbyggen","url":"https://www.stromstadsbyggen.se/","orter":["Strömstad"],"note":"kommunal"},{"name":"Stubo","url":"https://stubo.se/","orter":["Ulricehamn"],"note":"kommunal"},{"name":"Svenbo","url":"https://www.svenbo.com/","orter":["Svenljunga"],"note":"kommunal"},{"name":"Tanumsbostäder","url":"https://www.tanumsbostader.se/","orter":["Tanum"],"note":"kommunal"},{"name":"Tibrobyggen","url":"https://tibrobyggen.se/","orter":["Tibro"],"note":"kommunal"},{"name":"Tidaholms Bostads AB","url":"https://tbab.se/","orter":["Tidaholm"],"note":"kommunal"},{"name":"Tranemobostäder","url":"https://www.tranemobostader.se/","orter":["Tranemo"],"note":"kommunal"},{"name":"Trollängen","url":"https://www.trollangenbostad.se/","orter":["Göteborg","Vårgårda","Herrljunga"]},{"name":"Törebodabostäder","url":"https://www.torebodabostader.se/","orter":["Töreboda"],"note":"kommunal"},{"name":"Uddevallahem","url":"https://www.uddevallahem.se/","orter":["Uddevalla"],"note":"kommunal"},{"name":"Ullsaxen","url":"https://www.ullsaxen.se/","orter":["Borås","Rydal"]},{"name":"Valbohem (Färgelanda)","url":"https://www.valbohem.se/","orter":["Färgelanda"],"note":"kommunal"},{"name":"VaraBostäder","url":"https://varabostader.se/","orter":["Vara"],"note":"kommunal"},{"name":"Visiongruppen","url":"https://visionsgruppen.se/","orter":["Göteborg","Falköping"]},{"name":"Viskaforshem","url":"https://www.viskaforshem.se/","orter":["Borås"],"note":"kommunal"},{"name":"Vänersborgsbostäder","url":"https://www.vanersborgsbostader.se/","orter":["Vänersborg"],"note":"kommunal"},{"name":"Vårgårda Bostäder","url":"https://vargardabostader.se/","orter":["Vårgårda"],"note":"kommunal"},{"name":"Willhem","url":"https://willhem.se","orter":["Göteborg"]},{"name":"Åmåls Kommunfastigheter","url":"https://www.amalskommunfastigheter.se/","orter":["Åmål"],"note":"kommunal"}];
/* BOLAG_DATA_END */
const KEY='sok_bostad_linkcheck_v1';
let state={}; try{state=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){state={}}
let onlyBad=false;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function save(){localStorage.setItem(KEY,JSON.stringify(state)); renderStats()}
function setStatus(name,v){state[name]=v;save();renderRows()}
function renderStats(){let ok=0,bad=0;COMPANIES.forEach(c=>{if(state[c.name]==='ok')ok++;if(state[c.name]==='bad')bad++});let left=COMPANIES.length-ok-bad;document.getElementById('stats').innerHTML=`<div class="stat"><b>${COMPANIES.length}</b>Totalt</div><div class="stat"><b>${ok}</b>Fungerar</div><div class="stat"><b>${bad}</b>Trasiga</div><div class="stat"><b>${left}</b>Kvar</div>`}
function renderRows(){const q=document.getElementById('q').value.trim().toLowerCase();let data=COMPANIES.filter(c=>{if(onlyBad&&state[c.name]!=='bad')return false;return !q||(c.name+' '+c.orter.join(' ')).toLowerCase().includes(q)});document.getElementById('rows').innerHTML=data.map((c,i)=>{let s=state[c.name]||'';return `<tr><td data-label="#">${i+1}</td><td data-label="Hyresvärd"><strong>${esc(c.name)}</strong><br><span class="badge">${c.note==='kommunal'?'Kommunal':c.note==='formedling'?'Förmedling':'Privat'}</span></td><td data-label="Ort">${esc(c.orter.join(', '))}</td><td data-label="Länk"><a href="${esc(c.url)}" target="_blank" rel="noopener">Öppna ↗</a></td><td data-label="Status"><div class="choices"><label class="ok"><input type="radio" name="s_${i}" ${s==='ok'?'checked':''} onchange='setStatus(${JSON.stringify(c.name)},"ok")'> Fungerar</label><label class="bad"><input type="radio" name="s_${i}" ${s==='bad'?'checked':''} onchange='setStatus(${JSON.stringify(c.name)},"bad")'> Trasig</label></div></td></tr>`}).join('')}
document.getElementById('q').addEventListener('input',renderRows);document.getElementById('showBad').onclick=()=>{onlyBad=true;renderRows()};document.getElementById('showAll').onclick=()=>{onlyBad=false;renderRows()};document.getElementById('reset').onclick=()=>{if(confirm('Nollställa alla markeringar?')){state={};save();renderRows()}};renderStats();renderRows();
</script></body></html>
